    "/detect/music": {
      "post": {
        "operationId": "musicDetection_createMusicDetection",
        "summary": "Detect AI-generated music",
        "description": "Analyze a song or music track and classify it as AI-generated or human-produced.\n\nSupply audio via one of three intake methods:\n\n- **Direct file upload**: `multipart/form-data` with the file attached as `file`. Files must be 150 MB or smaller.\n- **Public URL**: `application/json` with a `url` field. Resemble downloads and stores the file before analysis.\n- **Secure upload token**: `application/json` with a `media_token` field obtained from `POST /secure_uploads`.\n\nExactly one of `file`, `url`, or `media_token` must be provided per request. Only audio files are\naccepted.\n\nProcessing is asynchronous by default: the response returns immediately with `status: processing`.\nMusic detections are standard detections, so you can poll\n[`GET /detect/{uuid}`](/api-reference/deepfake-detection/get-detection) or supply a `callback_url` to\nbe notified. Send the `Prefer: wait` header to block until the verdict is available and receive the\ncompleted item in the same response. Allow a generous client timeout when waiting, since the first\nrequest after a period of inactivity can take several minutes while the model warms up.\n\nEach successful analysis is billed as audio Deepfake Detection usage. Failed analyses are not billed.\n",
        "tags": [
          "musicDetection"
        ],
        "parameters": [
          {
            "name": "Prefer",
            "in": "header",
            "description": "When set to \"wait\", the API processes synchronously and returns the completed result.",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/DetectMusicPostParametersPrefer"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Music detection created (or completed when `Prefer: wait` was sent)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MusicDetectResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request: no `file`, `url`, or `media_token`; a non-audio file; a file over 150 MB; an invalid or expired `media_token`; a URL that resolves to a private address; or a malformed `callback_url`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "402": {
            "description": "Insufficient balance for the detection.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Audio Deepfake Detection is not included in your subscription.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Invalid `start_region`/`end_region`, or (with `Prefer: wait`) the audio could not be decoded. The failed item is returned in `item` with `status: failed`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MusicDetectResponse"
                }
              }
            }
          },
          "502": {
            "description": "With `Prefer: wait`, the detection model returned an error. The failed item is returned in `item`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MusicDetectResponse"
                }
              }
            }
          },
          "504": {
            "description": "With `Prefer: wait`, the detection model timed out. The failed item is returned in `item`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MusicDetectResponse"
                }
              }
            }
          }
        },
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "The audio file to analyze. Must be 150 MB or smaller."
                  },
                  "name": {
                    "type": "string",
                    "description": "Display name for the detection. Defaults to the source filename."
                  },
                  "callback_url": {
                    "type": "string",
                    "format": "uri",
                    "description": "POST destination for the result once processing finishes. The body matches the response of `GET /detect/{uuid}`."
                  },
                  "visualize": {
                    "type": "boolean",
                    "default": false,
                    "description": "Return a base64-encoded heatmap image in `metrics.image`."
                  },
                  "start_region": {
                    "type": "number",
                    "format": "double",
                    "description": "Start of the segment to analyze, in seconds."
                  },
                  "end_region": {
                    "type": "number",
                    "format": "double",
                    "description": "End of the segment to analyze, in seconds."
                  }
                },
                "required": [
                  "file"
                ]
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
