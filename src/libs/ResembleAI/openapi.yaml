{
  "openapi": "3.1.0",
  "info": {
    "title": "API Reference",
    "version": "1.0.0"
  },
  "paths": {
    "/detect": {
      "get": {
        "operationId": "list-detections",
        "summary": "List all detects",
        "description": "Retrieve a paginated list of all detect objects for the authenticated user's team",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "description": "Page number (must be >= 1)",
            "required": true,
            "schema": {
              "type": "integer"
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "description": "Number of items per page (10-1000)",
            "required": false,
            "schema": {
              "type": "integer",
              "default": 10
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "description": "API key from https://app.resemble.ai/hub/api",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of detects",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake Detection_listDetections_Response_200"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "create-detection",
        "summary": "Create deepfake detection",
        "description": "Analyze audio, image, and video for deepfake detection.\n\nSupply media via one of three intake methods:\n\n- **Direct file upload** — `multipart/form-data` with the file attached as `file`. Files must be 150 MB or smaller and use one of the supported audio/video/image extensions. For larger files, use the secure upload flow.\n- **Public URL** — `application/json` with a `url` field. The API fetches the URL itself.\n- **Secure upload token** — `application/json` with a `media_token` field obtained from `POST /secure_uploads`.\n\nExactly one of `file`, `url`, or `media_token` must be provided per request.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "Authorization",
            "in": "header",
            "description": "API key from https://app.resemble.ai/hub/api",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Detection job created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake Detection_createDetection_Response_200"
                }
              }
            }
          }
        },
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "The media file to analyze (audio, video, or image). Must be 150 MB or smaller."
                  },
                  "callback_url": {
                    "type": "string",
                    "format": "uri",
                    "description": "POST destination for the detection result."
                  },
                  "wait_for_intelligence": {
                    "type": "boolean",
                    "description": "Controls callback timing when callback_url and intelligence=true are provided. True waits without a forced timeout until Detect and Intelligence are both finished. False sends after Detect finishes without waiting for Intelligence. When omitted, the callback waits up to 10 minutes for Intelligence before sending the result state available at that time."
                  },
                  "visualize": {
                    "type": "boolean",
                    "description": "Generate visualization artifacts"
                  },
                  "frame_length": {
                    "type": "integer",
                    "default": 2,
                    "description": "Window size in seconds (audio/video)"
                  },
                  "start_region": {
                    "type": "number",
                    "format": "double",
                    "description": "Start of segment to analyze (seconds)"
                  },
                  "end_region": {
                    "type": "number",
                    "format": "double",
                    "description": "End of segment to analyze (seconds)"
                  },
                  "max_video_secs": {
                    "type": "number",
                    "format": "double",
                    "description": "Cap processed duration"
                  },
                  "modality": {
                    "$ref": "#/components/schemas/DetectPostRequestBodyContentMultipartFormDataSchemaModality",
                    "description": "Video only. Selects which detection components run for a video file:\n`audio` (audio track only), `video` (visual frames only), or `all` (both — the default).\nIgnored for audio and image inputs. Invalid values are rejected with HTTP 400.\n"
                  },
                  "face_only": {
                    "type": "boolean",
                    "default": false,
                    "description": "Focus visual video detection on faces by masking non-face regions. Effective only for\nvideo inputs with `modality=all` or `modality=video`. Audio, image, and `modality=audio`\nvideo requests are accepted but use an effective value of `false`.\n"
                  },
                  "intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run multimodal intelligence analysis on the media"
                  },
                  "infer_from_intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Opt in to let a strong intelligence finding escalate an otherwise non-fake verdict to \"Likely Fake\". Has no effect unless `intelligence` is also true."
                  },
                  "audio_source_tracing": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable audio source tracing to identify synthetic audio origin"
                  },
                  "signal": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run Signal content analysis after detection completes, classifying the media against fraud and abuse categories. Requires Signal access on your plan and cannot be combined with zero_retention_mode. Not supported for batch detections."
                  },
                  "use_reverse_search": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable reverse image search to improve detection accuracy for image files. Only applies to image detections."
                  },
                  "use_ood_detector": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable out-of-distribution detection"
                  },
                  "zero_retention_mode": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable Zero Retention Mode to automatically delete submitted media after detection completes."
                  }
                },
                "required": [
                  "file"
                ]
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/detect/{uuid}": {
      "get": {
        "operationId": "get-detection",
        "summary": "Get deepfake detection result",
        "description": "Get a deepfake detection result by UUID. The item status describes the Detect job only; Intelligence runs separately and can still be processing after Detect reaches completed.",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "The UUID of the detect object",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "experts",
            "in": "query",
            "description": "When true, return all successfully completed Intelligence results as an array, or an empty array when none have completed successfully. When omitted or false, return one completed result when available; otherwise, return the current processing or failed result.",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "description": "API key from https://app.resemble.ai/hub/api",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Detection result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake Detection_getDetection_Response_200"
                }
              }
            }
          },
          "404": {
            "description": "Detect not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/detect/batch": {
      "post": {
        "operationId": "create-detect-batch",
        "summary": "Create a batch deepfake detection job",
        "description": "Submit up to 50 files in a single request and process them as a single logical\ngroup. Returns HTTP 202 with a batch UUID; each file is analyzed in the\nbackground and individual results are available via `GET /detect/{uuid}` for\neach entry in `detect_uuids`.\n\nTwo intake methods:\n\n- **Multiple media files** — repeated `files[]` form fields.\n- **Single zip archive** — a single `file` form field whose value is a `.zip`\n  containing the media files. Non-media entries are skipped.\n\nProvide one of `files[]` or `file=<...>.zip` per request. Synchronous mode\n(`Prefer: wait`) is not supported and returns 400 if sent.\n\nConstraints:\n\n- Maximum 50 files per batch.\n- Maximum 500 MB total upload size across all files.\n- Allowed file types match `POST /detect`'s direct-upload allowlist.\n- All-or-nothing billing: if the team's wallet cannot cover the projected cost\n  for every file, the request is rejected with 402 and no detects are created.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "Authorization",
            "in": "header",
            "description": "API key from https://app.resemble.ai/hub/api",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Batch accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake Detection_createDetectBatch_Response_202"
                }
              }
            }
          },
          "400": {
            "description": "Invalid batch request (missing files, both file and files[] supplied, file count or size exceeded, unsupported file type, or `Prefer: wait` header sent)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "402": {
            "description": "Insufficient balance for the projected batch cost. Response `details` includes per-file estimates.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Intelligence detect limit reached (Default plan).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "files[]": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "format": "binary"
                    },
                    "description": "One or more media files. Repeat the `files[]` field for each file. Mutually exclusive with `file`."
                  },
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "A single `.zip` archive containing media files. Mutually exclusive with `files[]`."
                  },
                  "callback_url": {
                    "type": "string",
                    "format": "uri",
                    "description": "POST destination invoked when the batch reaches a terminal state."
                  },
                  "intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run multimodal intelligence on every file in the batch."
                  },
                  "infer_from_intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Opt in to let a strong intelligence finding escalate an otherwise non-fake verdict to \"Likely Fake\". Has no effect unless `intelligence` is also true."
                  },
                  "search_identity": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run identity search against the team's saved identities (audio/video only)."
                  },
                  "visualize": {
                    "type": "boolean",
                    "default": true,
                    "description": "Generate visualization artifacts."
                  },
                  "audio_source_tracing_enabled": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable audio source tracing on each audio file."
                  },
                  "frame_length": {
                    "type": "integer",
                    "description": "Window size in seconds (audio/video)."
                  },
                  "start_region": {
                    "type": "number",
                    "format": "double",
                    "description": "Start of segment to analyze (seconds)."
                  },
                  "end_region": {
                    "type": "number",
                    "format": "double",
                    "description": "End of segment to analyze (seconds)."
                  },
                  "max_video_secs": {
                    "type": "number",
                    "format": "double",
                    "description": "Cap processed video duration."
                  },
                  "use_llm": {
                    "type": "boolean",
                    "description": "Use LLM-assisted video analysis."
                  },
                  "face_only": {
                    "type": "boolean",
                    "default": false,
                    "description": "Focus detection on faces for video children by masking non-face regions. Audio and\nimage children use an effective value of `false`. Retrieve each child's effective value\nwith `GET /detect/{uuid}`; the aggregate batch response does not include this field.\n"
                  },
                  "zero_retention_mode": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable Zero Retention Mode for every file in the batch."
                  }
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/detect/batch/{uuid}": {
      "get": {
        "operationId": "get-detect-batch",
        "summary": "Get batch status",
        "description": "Retrieve the latest aggregate status for a batch. The response shape mirrors\nthe create response — `status`, `completed_count`, and `failed_count` update\nas child detects progress. Use the `detect_uuids` array to fetch per-file\nresults via `GET /detect/{uuid}`.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "Batch UUID returned by `POST /detect/batch`.",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "description": "API key from https://app.resemble.ai/hub/api",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Batch status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake Detection_getDetectBatch_Response_200"
                }
              }
            }
          },
          "404": {
            "description": "Batch not found (or not accessible by the authenticated team).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
