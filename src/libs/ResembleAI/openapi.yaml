{
  "openapi": "3.1.0",
  "info": {
    "title": "API Reference",
    "version": "1.0.0"
  },
  "paths": {
    "/detect": {
      "get": {
        "operationId": "deepfakeDetection_listDetections",
        "summary": "List all detects",
        "description": "Retrieve a paginated list of all detect objects for the authenticated user's team",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "description": "Page number (must be >= 1)",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "description": "Number of items per page (10-1000)",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 10,
              "maximum": 1000,
              "default": 10
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of detects",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_listDetections_Response_200"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "post": {
        "operationId": "deepfakeDetection_createDetection",
        "summary": "Create deepfake detection",
        "description": "Analyze audio, image, and video for deepfake detection.\n\nSupply media via one of three intake methods:\n\n- **Direct file upload** — `multipart/form-data` with the file attached as `file`. Files must be 150 MB or smaller and use one of the supported audio/video/image extensions. For larger files, use the secure upload flow.\n- **Public URL** — `application/json` with a `url` field. The API fetches the URL itself.\n- **Secure upload token** — `application/json` with a `media_token` field obtained from `POST /secure_uploads`.\n\nExactly one of `file`, `url`, or `media_token` must be provided per request.\n\nSet `detect_watermark=true` to run Resemble watermark detection and SynthID alongside the deepfake\nanalysis. This option supports single audio, image, and video requests only. It adds one Watermark\ndetection charge, applies a 200 MB source limit for audio, image, and video, and causes\n`Prefer: wait` and callbacks to wait for the watermark analysis to reach a terminal state. A watermark\nfailure is returned in the nested `watermark` object and does not change the deepfake verdict.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "responses": {
          "200": {
            "description": "Detection job created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_createDetection_Response_200"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request, including a malformed `detect_watermark` boolean or a known source that exceeds the Watermark decoder limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "402": {
            "description": "Insufficient balance for the combined Detect request. When watermark analysis was requested, details include `watermark_cost_cents`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateDetectionRequestPaymentRequiredError"
                }
              }
            }
          },
          "403": {
            "description": "The API key does not have access to Watermark detection or another requested product.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "The media file to analyze (audio, video, or image). Must be 150 MB or smaller."
                  },
                  "callback_url": {
                    "type": "string",
                    "format": "uri",
                    "description": "POST destination for the detection result."
                  },
                  "wait_for_intelligence": {
                    "type": "boolean",
                    "description": "Controls callback timing when callback_url and intelligence=true are provided. True waits without a forced timeout until Detect and Intelligence are both finished. False sends after Detect finishes without waiting for Intelligence. When omitted, the callback waits up to 10 minutes for Intelligence before sending the result state available at that time."
                  },
                  "visualize": {
                    "type": "boolean",
                    "description": "Generate visualization artifacts"
                  },
                  "frame_length": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 4,
                    "default": 4,
                    "description": "Window size in seconds (audio/video). We recommend 4 for audio."
                  },
                  "start_region": {
                    "type": "number",
                    "format": "double",
                    "description": "Start of segment to analyze (seconds)"
                  },
                  "end_region": {
                    "type": "number",
                    "format": "double",
                    "description": "End of segment to analyze (seconds)"
                  },
                  "max_video_secs": {
                    "type": "number",
                    "format": "double",
                    "description": "Cap processed duration"
                  },
                  "modality": {
                    "$ref": "#/components/schemas/DetectPostRequestBodyContentMultipartFormDataSchemaModality",
                    "description": "Video only. Selects which detection components run for a video file:\n`audio` (audio track only), `video` (visual frames only), or `all` (both — the default).\nIgnored for audio and image inputs. Invalid values are rejected with HTTP 400.\n"
                  },
                  "face_only": {
                    "type": "boolean",
                    "default": false,
                    "description": "Focus visual video detection on faces by masking non-face regions. Effective only for\nvideo inputs with `modality=all` or `modality=video`. Audio, image, and `modality=audio`\nvideo requests are accepted but use an effective value of `false`.\n"
                  },
                  "intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run multimodal intelligence analysis on the media"
                  },
                  "detect_watermark": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run Resemble watermark detection and SynthID. Supported for single audio, image, and video requests. Adds the Watermark detection charge and applies a source limit of 200 MB for audio, image, and video."
                  },
                  "infer_from_intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Opt in to let a strong intelligence finding escalate an otherwise non-fake verdict to \"Likely Fake\". Has no effect unless `intelligence` is also true."
                  },
                  "audio_source_tracing": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable audio source tracing to identify synthetic audio origin"
                  },
                  "signal": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run Signal content analysis after detection completes, classifying the media against fraud and abuse categories. Requires Signal access on your plan and cannot be combined with zero_retention_mode. Not supported for batch detections."
                  },
                  "use_reverse_search": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable reverse image search to improve detection accuracy for image files. Only applies to image detections."
                  },
                  "use_ood_detector": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable out-of-distribution detection"
                  },
                  "zero_retention_mode": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable Zero Retention Mode to automatically delete submitted media after detection completes."
                  }
                },
                "required": [
                  "file"
                ]
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/detect/{uuid}": {
      "get": {
        "operationId": "deepfakeDetection_getDetection",
        "summary": "Get deepfake detection result",
        "description": "Get a deepfake detection result by UUID. For an otherwise successful Detect with watermark analysis, item status remains processing until the linked analysis completes or fails. A core detection failure still reports failed. Intelligence runs separately and can still be processing after Detect reaches completed.",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "The UUID of the detect object",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "experts",
            "in": "query",
            "description": "When true, return all successfully completed Intelligence results as an array, or an empty array when none have completed successfully. When omitted or false, return one completed result when available; otherwise, return the current processing or failed result.",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Detection result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_getDetection_Response_200"
                }
              }
            }
          },
          "404": {
            "description": "Detect not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "delete": {
        "operationId": "deepfakeDetection_deleteDetection",
        "summary": "Delete deepfake detection",
        "description": "Delete a detection belonging to the authenticated user's team. Once deleted, the detection is no longer returned by list or get requests.",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "The UUID of the detect object",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Detection deleted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_deleteDetection_Response_200"
                }
              }
            }
          },
          "404": {
            "description": "Detect not found. Unknown UUIDs and detects belonging to another team are indistinguishable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/detect/batch": {
      "post": {
        "operationId": "deepfakeDetection_createDetectBatch",
        "summary": "Create a batch deepfake detection job",
        "description": "Submit up to 50 files in a single request and process them as a single logical\ngroup. Returns HTTP 202 with a batch UUID; each file is analyzed in the\nbackground and individual results are available via `GET /detect/{uuid}` for\neach entry in `detect_uuids`.\n\nTwo intake methods:\n\n- **Multiple media files** — repeated `files[]` form fields.\n- **Single zip archive** — a single `file` form field whose value is a `.zip`\n  containing the media files. Non-media entries are skipped.\n\nProvide one of `files[]` or `file=<...>.zip` per request. Synchronous mode\n(`Prefer: wait`) is not supported and returns 400 if sent.\n\nConstraints:\n\n- Maximum 50 files per batch.\n- Maximum 500 MB total upload size across all files.\n- Allowed file types match `POST /detect`'s direct-upload allowlist.\n- Watermark analysis is not supported for batch or zip requests. Sending `detect_watermark=true` returns 400.\n- All-or-nothing billing: if the team's wallet cannot cover the projected cost\n  for every file, the request is rejected with 402 and no detects are created.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "responses": {
          "202": {
            "description": "Batch accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_createDetectBatch_Response_202"
                }
              }
            }
          },
          "400": {
            "description": "Invalid batch request (missing files, both file and files[] supplied, file count or size exceeded, unsupported file type, `Prefer: wait` header sent, or `detect_watermark=true`)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "402": {
            "description": "Insufficient balance for the projected batch cost. Response `details` includes per-file estimates.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Intelligence detect limit reached (Default plan).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "files[]": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "format": "binary"
                    },
                    "description": "One or more media files. Repeat the `files[]` field for each file. Mutually exclusive with `file`."
                  },
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "A single `.zip` archive containing media files. Mutually exclusive with `files[]`."
                  },
                  "callback_url": {
                    "type": "string",
                    "format": "uri",
                    "description": "POST destination invoked when the batch reaches a terminal state."
                  },
                  "intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run multimodal intelligence on every file in the batch."
                  },
                  "infer_from_intelligence": {
                    "type": "boolean",
                    "default": false,
                    "description": "Opt in to let a strong intelligence finding escalate an otherwise non-fake verdict to \"Likely Fake\". Has no effect unless `intelligence` is also true."
                  },
                  "search_identity": {
                    "type": "boolean",
                    "default": false,
                    "description": "Run identity search against the team's saved identities (audio/video only)."
                  },
                  "visualize": {
                    "type": "boolean",
                    "default": true,
                    "description": "Generate visualization artifacts."
                  },
                  "audio_source_tracing_enabled": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable audio source tracing on each audio file."
                  },
                  "frame_length": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 4,
                    "description": "Window size in seconds (audio/video)."
                  },
                  "start_region": {
                    "type": "number",
                    "format": "double",
                    "description": "Start of segment to analyze (seconds)."
                  },
                  "end_region": {
                    "type": "number",
                    "format": "double",
                    "description": "End of segment to analyze (seconds)."
                  },
                  "max_video_secs": {
                    "type": "number",
                    "format": "double",
                    "description": "Cap processed video duration."
                  },
                  "use_llm": {
                    "type": "boolean",
                    "description": "Use LLM-assisted video analysis."
                  },
                  "face_only": {
                    "type": "boolean",
                    "default": false,
                    "description": "Focus detection on faces for video children by masking non-face regions. Audio and\nimage children use an effective value of `false`. Retrieve each child's effective value\nwith `GET /detect/{uuid}`; the aggregate batch response does not include this field.\n"
                  },
                  "zero_retention_mode": {
                    "type": "boolean",
                    "default": false,
                    "description": "Enable Zero Retention Mode for every file in the batch."
                  }
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/detect/batch/{uuid}": {
      "get": {
        "operationId": "deepfakeDetection_getDetectBatch",
        "summary": "Get batch status",
        "description": "Retrieve the latest aggregate status for a batch. The response shape mirrors\nthe create response — `status`, `completed_count`, and `failed_count` update\nas child detects progress. Use the `detect_uuids` array to fetch per-file\nresults via `GET /detect/{uuid}`.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "Batch UUID returned by `POST /detect/batch`.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Batch status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_getDetectBatch_Response_200"
                }
              }
            }
          },
          "404": {
            "description": "Batch not found (or not accessible by the authenticated team).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/detect/{uuid}/feedback": {
      "get": {
        "operationId": "deepfakeDetection_getDetectFeedback",
        "summary": "Get detection feedback",
        "description": "Retrieve your own feedback for a detect. Returns 404 when *you* haven't answered this\ndetect, even if the detect exists and a teammate has answered it.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "UUID of the detect.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Feedback",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_getDetectFeedback_Response_200"
                }
              }
            }
          },
          "404": {
            "description": "No such detect for the authenticated team, or you have not left feedback on it.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "post": {
        "operationId": "deepfakeDetection_createDetectFeedback",
        "summary": "Submit detection feedback",
        "description": "Tell Resemble whether a detection verdict was right — and when it wasn't, what it\nshould have been. The answer is stored with a snapshot of what the model said at the\ntime of submission (verdict, score, media type, raw metrics), so it stays interpretable\neven if the detect is later re-run or deleted.\n\nUpserts on `(detect, user)`: re-posting edits your existing answer rather than adding a\nsecond one. There is no separate update call. Feedback is per user, not per team — a\nteammate's answer on the same detect is invisible to you.\n\nThe detect must have completed processing; feedback on a pending or failed detect is\nrejected with 400. Teams without Detect access also receive 400 (not 403).\n",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "UUID of the completed detect.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Feedback recorded",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_createDetectFeedback_Response_200"
                }
              }
            }
          },
          "400": {
            "description": "Unknown or missing `type`, `comment` over 1000 characters, the detect has not completed processing, or the team does not have Detect access.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "No such detect for the authenticated team.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "type": {
                    "$ref": "#/components/schemas/DetectUuidFeedbackPostRequestBodyContentApplicationJsonSchemaType",
                    "description": "What the verdict should have been.\n  - `correct` — the verdict was right.\n  - `should_be_ai_generated` — we said authentic; it is AI-generated.\n  - `should_be_authentic` — we said AI-generated; it is genuine and unaltered.\n  - `should_be_non_ai` — no model generated it, but it may still be edited, spliced, or a human impersonation.\n  - `should_be_neutral` — neither call is right; the media is genuinely ambiguous.\n  - `skipped` — the verdict was wrong, but the reviewer didn't say how.\n"
                  },
                  "comment": {
                    "type": "string",
                    "maxLength": 1000,
                    "description": "Free text, up to 1000 characters. Trimmed; blank becomes `null`."
                  },
                  "source": {
                    "type": "string",
                    "default": "api",
                    "description": "Where the answer came from. Use a stable, aggregatable value such as a product\nor queue name — not a per-request identifier. Truncated to 64 characters\nrather than rejected.\n"
                  }
                },
                "required": [
                  "type"
                ]
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "delete": {
        "operationId": "deepfakeDetection_deleteDetectFeedback",
        "summary": "Delete detection feedback",
        "description": "Retract your own feedback. Idempotent — returns 200 whether or not a row existed. Only\nyour row is removed; a teammate's answer on the same detect is untouched. Works even on\na detect that later failed.\n",
        "tags": [
          "deepfakeDetection"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "UUID of the detect.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Feedback retracted (or none existed)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deepfake_Detection_deleteDetectFeedback_Response_200"
                }
              }
            }
          },
          "404": {
            "description": "No such detect for the authenticated team.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/agents": {
      "get": {
        "operationId": "detectAgents_listDetectAgents",
        "summary": "List Detect Agents",
        "description": "Return all six managed Detect Agents available to the authenticated team.\nUse an agent's `uuid` to run an investigation or retrieve its run history.\nThis endpoint does not accept pagination or filtering parameters.\n",
        "tags": [
          "detectAgents"
        ],
        "responses": {
          "200": {
            "description": "All six Detect Agents",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Detect_Agents_listDetectAgents_Response_200"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid API key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "The account does not have Detect Agents access",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "Detect Agents service unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/agents/{uuid}/run": {
      "post": {
        "operationId": "detectAgents_runDetectAgentInvestigation",
        "summary": "Run investigation",
        "description": "Run a managed Detect Agent against uploaded media or a public URL.\nThe response is a live Server-Sent Events stream. The first `run_started`\nevent contains the persisted run identifier.\n",
        "tags": [
          "detectAgents"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "Stable Detect Agent identifier returned by `GET /agents`.",
