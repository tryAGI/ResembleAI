        "tags": [
          "detectAgents"
        ],
        "parameters": [
          {
            "name": "Authorization",
            "in": "header",
            "description": "API key from https://app.resemble.ai/hub/api",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "All six Detect Agents",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Detect Agents_listDetectAgents_Response_200"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid API key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "The account does not have Detect Agents access",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "Detect Agents service unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/agents/{uuid}/run": {
      "post": {
        "operationId": "run-detect-agent-investigation",
        "summary": "Run investigation",
        "description": "Run a managed Detect Agent against uploaded media or a public URL.\nThe response is a live Server-Sent Events stream. The first `run_started`\nevent contains the persisted run identifier.\n",
        "tags": [
          "detectAgents"
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "Stable Detect Agent identifier returned by `GET /agents`.",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "description": "API key from https://app.resemble.ai/hub/api",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Response with status 200",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {}
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid API key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "402": {
            "description": "The investigation is blocked by billing or available credits",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "The account does not have Detect Agents access",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Detect Agent not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Neither `file` nor `url` was provided",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "Detect Agents service unavailable before streaming begins",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "Primary media to analyze. Required when `url` is omitted."
                  },
                  "url": {
                    "type": "string",
                    "format": "uri",
                    "description": "Public media URL to analyze. Required when `file` is omitted."
                  },
                  "query": {
                    "type": "string",
                    "description": "Question or investigation objective."
                  },
                  "evidence[]": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "format": "binary"
                    },
                    "description": "Supporting evidence files. Repeat this field for multiple files."
                  },
                  "check_urls": {
                    "type": "string",
                    "description": "Additional URLs for the Detect Agent to check."
                  }
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
