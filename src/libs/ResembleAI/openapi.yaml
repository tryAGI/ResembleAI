            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://app.resemble.ai/api/v2"
        }
      ]
    },
    "/intelligence": {
      "post": {
        "operationId": "run-intelligence",
        "summary": "Run intelligence",
